<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe El Trigal</title>
</head>
<body>
    <header>
        <h1>Cafe El Trigal</h1>
    </header>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#nuestroCafe">Nuestro Cafe</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <section id="inicio"></section>
    <section id="cafe">
        <h2>Nuestro Cafe</h2>
        <p>Bienvenidos a la cafeteria Nuestro Cafe , pensada para poder pasar momentos inolvidables con un rico cafe</p>
        <ul>
            <li>Café americano - Bs 12</li>
            <li>Capuchino - Bs 18</li>
            <li>Submarino - Bs 15</li>
        </ul>
    </section>
    <section id="contacto">
        <h2>Haz tu pedido</h2>
        <form>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" required>
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" required>
            <label for="pedido">Tu pedido</label>
            <textarea id="pedido"></textarea>
        </form>
        <button type="button" id="btn-confirmar">Confirmar pedido</button>
        <p id="mensaje" class="oculto"></p>
    </section>
    <footer></footer>

</body>
</html>
